# OpenOCD configuration for STM32G0B1RET6 on NUCLEO-G0B1RET6
# Uses ST-Link v2 debugger (integrated on NUCLEO board)

# Interface: ST-Link v2
source [find interface/stlink.cfg]

# Transport: SWD (Serial Wire Debug)
transport select swd

# Target: STM32G0B1RET6
# This chip is from the STM32G0 family (Cortex-M0+)
# Since STM32G0B1 is newer, we use the G071 target as a base
# (architecture is compatible)

# Source device file — G0B1 not yet in mainline, so use G071 + override
source [find target/stm32g0x.cfg]

# Reset strategy: SRST (system reset)
reset_config srst_only srst_push_pull

# Reduce speed during init (safe)
adapter speed 1000

# Increase speed after connect (up to 4000 kHz for M0+)
$_TARGETNAME configure -event reset-init {
  adapter speed 4000
}

# Optional: dump debug info
# set CPUTAPID 0x0bc12477
